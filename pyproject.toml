[project]
name = "mattermost-bolt"
version = "0.1.0"
description = "Slack Bolt 호환 인터페이스를 유지하는 Mattermost 앱 프레임워크"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mattermost-bolt contributors" }]
keywords = ["mattermost", "slack", "bolt", "bot", "chatops", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/ady95/mattermost-bolt"
Repository = "https://github.com/ady95/mattermost-bolt"
Issues = "https://github.com/ady95/mattermost-bolt/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mattermost_bolt"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "SIM105", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
"spikes/*" = ["E402", "T201"]

[tool.mypy]
# mypy 는 3.10 미만을 더 이상 검사하지 못한다. 3.9 호환은 ruff(target-version=py39)와
# CI 의 3.9 매트릭스로 지킨다.
python_version = "3.10"
files = ["src/mattermost_bolt"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
